name: Detect RPO (killer satellites)

# キラー衛星（近接運用）の検知。OP's LAB Maps の知らせ用に data/rpo.json を出す（中身は scripts/rpo_detect.py）。
# 全カタログの問い合わせは Space-Track の目安が1時間に1回まで＝6時間ごと。
# 毎時の fetch-tle.yml（0分）と push がぶつからないよう30分にずらす。
on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write        # 新しい組が鳴ったら Issue で知らせる（GitHub がメールを送る）

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests sgp4 numpy

      - name: Detect
        env:
          SPACETRACK_USERNAME: ${{ secrets.SPACETRACK_USERNAME }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
        run: python3 scripts/rpo_detect.py

      - name: Commit and Push
        run: |
          git config --local user.email "iqps.lover@gmail.com"
          git config --local user.name "iqpslover-byte"
          git add data/rpo.json data/rpo_state.json data/rpo_hist.json
          git commit -m "Update rpo: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || exit 0
          git pull --rebase origin main
          git push origin main

      # 軌道面が近い衛星（アプリ）用の _planes.json は、履歴を持たない planes ブランチへ毎回上書きで置く。
      # main に積むと約4MB×1日4回ずつ履歴が膨らむため。アプリは raw.githubusercontent.com/.../planes/planes.json を読む
      - name: Publish planes
        if: ${{ hashFiles('_planes.json') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/planes && cp _planes.json /tmp/planes/planes.json
          cd /tmp/planes
          git init -q -b planes
          git config user.email "iqps.lover@gmail.com"
          git config user.name "iqpslover-byte"
          git add planes.json
          git commit -q -m "Update planes: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" planes

      # 新しい組が鳴った時だけ Issue を立てる（Get_NOTAM と同じ方式・知らせるのが目的なので立てたらすぐ閉じる）。
      # ★自分で gh から立てた Issue は自分に通知されない＝必ず Actions から立てる。
      - name: Notify new pairs
        if: ${{ hashFiles('_new_rpo.md') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create rpo --color B60205 --description "キラー衛星の検知" --force
          title=$(head -1 _new_rpo.md)
          tail -n +2 _new_rpo.md > body.md
          echo "" >> body.md
          echo "@${{ github.repository_owner }}" >> body.md
          url=$(gh issue create --title "$title" --body-file body.md --label rpo)
          echo "$url"
          gh issue close "$url" --comment "お知らせのみ（自動）"
