name: Fetch Satellite Data

on:
  schedule:
    - cron: '0 * * * *'  # 毎時間実行
  workflow_dispatch:     # 手動実行も可能

permissions:
  contents: write
  issues: write        # 登録衛星を読めなかった時に Issue で知らせる（GitHub がメールを送る）

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Space-Track Satcat
        env:
          SPACETRACK_USERNAME: ${{ secrets.SPACETRACK_USERNAME }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
          OPS_SETTINGS_TOKEN: ${{ secrets.OPS_SETTINGS_TOKEN }}   # OP's LAB Maps（非公開）の登録衛星を読む読み取り専用の鍵
        run: |
          python3 << 'EOF'
          import requests
          import json
          import os
          from datetime import datetime

          username = os.environ['SPACETRACK_USERNAME']
          password = os.environ['SPACETRACK_PASSWORD']

          session = requests.Session()
          session.post('https://www.space-track.org/ajaxauth/login',
                       data={'identity': username, 'password': password})

          url = 'https://www.space-track.org/basicspacedata/query/class/satcat/orderby/NORAD_CAT_ID%20desc/format/json'

          try:
              response = session.get(url, timeout=120)
              response.raise_for_status()
              raw = response.json()

              data = []
              for row in raw:
                  if not row.get('NORAD_CAT_ID'):
                      continue
                  data.append({
                      'NORAD_CAT_ID': row.get('NORAD_CAT_ID', ''),
                      'OBJECT_NAME':  row.get('OBJECT_NAME', row.get('SATNAME', '')),
                      'INTLDES':      row.get('INTLDES', row.get('OBJECT_ID', '')),
                      'OBJECT_TYPE':  row.get('OBJECT_TYPE', ''),
                      'COUNTRY':      row.get('COUNTRY', ''),
                      'LAUNCH':       row.get('LAUNCH', ''),
                      'SITE':         row.get('SITE', ''),
                      'DECAY':        row.get('DECAY', ''),
                      'PERIOD':       row.get('PERIOD', ''),
                      'INCL':         row.get('INCLINATION', row.get('INCL', '')),
                      'APOGEE':       row.get('APOGEE', ''),
                      'PERIGEE':      row.get('PERIGEE', ''),
                      'RCS':          row.get('RCSVALUE', row.get('RCS', '')),
                  })

              os.makedirs('data', exist_ok=True)
              updated_at = datetime.utcnow().isoformat() + 'Z'

              with open('data/satcat.json', 'w', encoding='utf-8') as f:
                  json.dump({'updated_at': updated_at, 'count': len(data), 'data': data},
                            f, separators=(',', ':'), ensure_ascii=False)

              with open('data/satcat_meta.json', 'w', encoding='utf-8') as f:
                  json.dump({'updated_at': updated_at, 'count': len(data)},
                            f, separators=(',', ':'))

              print(f'✓ {len(data)} 件のカタログデータを保存しました')

          except Exception as e:
              print(f'✗ エラー: {e}')
              exit(1)

          # ── gp クラス（TLE2行付き・登録が新しい300件）。satcat と同じセッションを再利用 ──
          try:
              # カタログ登録が新しい順に300件。
              # ★LAUNCH_DATE順にすると『打上げ日が空欄』の機(直近300機中96機)が永久に取れない。
              # ★20万番台は解析用の仮オブジェクトで上位を独占するため除外する。
              gp_url = 'https://www.space-track.org/basicspacedata/query/class/gp/NORAD_CAT_ID/%3C200000/orderby/NORAD_CAT_ID%20desc/limit/300/format/json'
              gp_res = session.get(gp_url, timeout=120)
              gp_res.raise_for_status()
              gp_raw = gp_res.json()

              tle_data = []
              for row in gp_raw:
                  if not row.get('NORAD_CAT_ID') or not row.get('TLE_LINE1') or not row.get('TLE_LINE2'):
                      continue
                  tle_data.append({
                      'NORAD_CAT_ID': row.get('NORAD_CAT_ID', ''),
                      'OBJECT_NAME':  row.get('OBJECT_NAME', ''),
                      'OBJECT_ID':    row.get('OBJECT_ID', ''),
                      'EPOCH':        row.get('EPOCH', ''),
                      'TLE_LINE1':    row.get('TLE_LINE1', ''),
                      'TLE_LINE2':    row.get('TLE_LINE2', ''),
                  })

              # ── 追跡している機を番号指定で追加する（★桁数と新旧に関係なく必ず配信へ）──
              # 上の300件は「番号順に上から」なので、番号が古くなると窓から落ちる。
              # 5桁の頃は落ちても個人運営のTLE APIが答えたが、6桁はそのAPIが持っておらず、
              # CelesTrak は利用者の回線から届かない＝落ちた瞬間に取得先がゼロになる。
              # ★追跡する機＝OP's LAB Maps に登録している衛星（2026-10-21）。手で tracked.json に書き足す作りでは
              #   STRIX-10 を書き忘れて TLE が取れなかった。読めた時は tracked.json をその内容で書き直す（削除した機も外れる）。
              #   読めなかった時は前回の tracked.json で続け、_tracked_err.md を書く＝下の手順が Issue で知らせる。
              tracked = []
              reg_err = None
              tok = os.environ.get('OPS_SETTINGS_TOKEN', '')
              if tok:
                  try:
                      rr = requests.get('https://api.github.com/repos/iqpslover-byte/OPs_LAB_Maps/contents/data/app_settings.json',
                                        headers={'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github.raw'}, timeout=60)
                      rr.raise_for_status()
                      sv = rr.json().get('satSatellites')
                      sv = sv.get('v', sv) if isinstance(sv, dict) else sv
                      arr = json.loads(sv) if isinstance(sv, str) else sv
                      names = {}
                      for x in arr:
                          n = str(int(x['num'])); tracked.append(n); names[n] = str(x.get('name', '')).split('\n')[0]
                      if not tracked:
                          raise ValueError('登録衛星が0機')
                      with open('data/tracked.json', 'w', encoding='utf-8') as tf:
                          json.dump({'note': "OP's LAB Maps に登録している衛星（毎時、OP's LAB Maps の data/app_settings.json から書き直す・手で編集しない）。"
                                             "tle_recent.json の新着300件から外れても必ず配信に含める。",
                                     'count': len(tracked), 'ids': [int(n) for n in tracked], 'names': names},
                                    tf, ensure_ascii=False, indent=2)
                      print(f'登録衛星 {len(tracked)} 機（OP\'s LAB Maps の設定から）')
                  except Exception as e:
                      tracked = []
                      reg_err = f'{e}'
              else:
                  reg_err = 'シークレット OPS_SETTINGS_TOKEN が未設定'
              if not tracked:
                  try:
                      with open('data/tracked.json', encoding='utf-8') as tf:
                          tracked = [str(int(x)) for x in json.load(tf).get('ids', [])]
                  except Exception as e:
                      tracked = []
                      print(f'! tracked.json を読めませんでした: {e}')
              if reg_err and tok:   # 鍵が未設定の間は知らせない（前回の tracked.json で静かに続ける）
                  print(f'! 登録衛星を読めませんでした（前回の tracked.json で続ける）: {reg_err}')
                  with open('_tracked_err.md', 'w', encoding='utf-8') as ef:
                      ef.write("TLE の配信：OP's LAB Maps の登録衛星を読めませんでした\n"
                               f"理由：{reg_err}\n\n前回の tracked.json（{len(tracked)} 機）で取得を続けています。"
                               "読み取り専用の鍵（シークレット OPS_SETTINGS_TOKEN）の期限切れ・取り消しを確かめてください。\n")

              have = {str(r['NORAD_CAT_ID']) for r in tle_data}
              missing = [n for n in tracked if n not in have]
              if missing:
                  try:
                      add_url = ('https://www.space-track.org/basicspacedata/query/class/gp/'
                                 'NORAD_CAT_ID/' + ','.join(missing) + '/format/json')
                      add_res = session.get(add_url, timeout=120)
                      add_res.raise_for_status()
                      n_add = 0
                      for row in add_res.json():
                          if not row.get('NORAD_CAT_ID') or not row.get('TLE_LINE1') or not row.get('TLE_LINE2'):
                              continue
                          tle_data.append({
                              'NORAD_CAT_ID': row.get('NORAD_CAT_ID', ''),
                              'OBJECT_NAME':  row.get('OBJECT_NAME', ''),
                              'OBJECT_ID':    row.get('OBJECT_ID', ''),
                              'EPOCH':        row.get('EPOCH', ''),
                              'TLE_LINE1':    row.get('TLE_LINE1', ''),
                              'TLE_LINE2':    row.get('TLE_LINE2', ''),
                          })
                          n_add += 1
                      print(f'✓ 追跡機を {n_add} 件追加しました（不足 {len(missing)} 件）')
                  except Exception as e:
                      print(f'✗ 追跡機の取得エラー: {e}')
              else:
                  print('✓ 追跡機はすべて新着300件に含まれています')

              with open('data/tle_recent.json', 'w', encoding='utf-8') as f:
                  json.dump({'updated_at': datetime.utcnow().isoformat() + 'Z', 'count': len(tle_data), 'data': tle_data},
                            f, separators=(',', ':'), ensure_ascii=False)

              print(f'✓ {len(tle_data)} 件のTLEを保存しました（tle_recent.json・新着300件＋追跡機）')

          except Exception as e:
              print(f'✗ TLE取得エラー: {e}')
          EOF

      # 宇宙天気（日ごとの Ap・F10.7）を GFZ から取る。OP's LAB Maps の軌道履歴グラフ下段用。
      # 失敗しても TLE の配信は止めない（前回のファイルがそのまま残る）
      - name: Fetch space weather (GFZ)
        continue-on-error: true
        run: python3 scripts/fetch_spaceweather.py

      # 再突入予測（Space-Track の TIP）。OP's LAB Maps の「再突入予測」レイヤー用。
      # 失敗しても TLE の配信は止めない（前回のファイルがそのまま残る）
      - name: Fetch reentry predictions (TIP)
        continue-on-error: true
        env:
          SPACETRACK_USERNAME: ${{ secrets.SPACETRACK_USERNAME }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
        run: python3 scripts/fetch_tip.py

      # 過去1年の再突入（TIP の確定報告）。OP's LAB Maps の再突入予測の表用。1日1回だけ取り直す（スクリプト側で判定）
      - name: Fetch past reentries (TIP final reports)
        continue-on-error: true
        env:
          SPACETRACK_USERNAME: ${{ secrets.SPACETRACK_USERNAME }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
        run: python3 scripts/fetch_tip_hist.py

      - name: Commit and Push
        run: |
          git config --local user.email "iqps.lover@gmail.com"
          git config --local user.name "iqpslover-byte"
          git add data/satcat.json data/satcat_meta.json data/tle_recent.json data/tracked.json
          git add data/spaceweather.csv 2>/dev/null || true
          git add data/tip.json 2>/dev/null || true
          git add data/tip_hist.json 2>/dev/null || true
          git commit -m "Update satcat: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
          git push origin main

      # 登録衛星を読めなかった時だけ Issue で知らせる（キラー衛星の知らせと同じ方式）。開いたままの知らせがある間は立てない＝毎時の重複を防ぐ。
      # 直したらその Issue を閉じる＝次にまた読めなくなった時に知らせる
      - name: Notify tracked list error
        if: ${{ hashFiles('_tracked_err.md') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create tracked --color D93F0B --description "TLE の配信：登録衛星を読めない" --force
          if [ -z "$(gh issue list --label tracked --state open --json number -q '.[].number')" ]; then
            title=$(head -1 _tracked_err.md)
            tail -n +2 _tracked_err.md > body.md
            echo "" >> body.md
            echo "@${{ github.repository_owner }}" >> body.md
            gh issue create --title "$title" --body-file body.md --label tracked
          fi
